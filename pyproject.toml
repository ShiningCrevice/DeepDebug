[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deepdebug-agent"
version = "0.1.0"
description = "Evidence-based diagnosis assistant for PyTorch failures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
]

[project.scripts]
deepdebug = "deepdebug.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
capture = ["torch==2.9.1", "numpy>=2,<3"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/deepdebug"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["benchmark/**/materials/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
